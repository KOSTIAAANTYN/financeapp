name: Docker Image CI

on:
  push:
    branches: [ "JWTv2" ]
  pull_request:
    branches: [ "JWTv2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag my-image-name:$(date +%s)
